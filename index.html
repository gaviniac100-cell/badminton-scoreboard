    .dialog-bg{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#020b09df;z-index:10}.dialog-bg.show{display:grid}.dialog{width:min(100%,420px);background:#102a24;border:1px solid #4c7167;border-radius:20px;padding:23px;text-align:center}.dialog h2{margin:0 0 7px}.dialog p{margin:0 0 16px;color:var(--muted);line-height:1.6}.dialog button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--yellow);font-weight:900}.rotate-hint{display:none;position:fixed;inset:0;z-index:20;background:#061814f5;place-items:center;text-align:center;padding:28px}.rotate-box{max-width:320px}.rotate-icon{font-size:70px;display:block;animation:turn 1.7s ease-in-out infinite}.rotate-box h2{margin:10px 0 6px}.rotate-box p{color:var(--muted);line-height:1.6}.rotate-box button{border:0;border-radius:12px;background:var(--yellow);color:#281f05;padding:12px 18px;font-weight:900}@keyframes turn{0%,25%{transform:rotate(0)}75%,100%{transform:rotate(90deg)}}
    @media(max-width:600px){.app{padding-top:10px}.sub{display:none}.card{padding:13px}.court{min-height:300px}.slot{min-height:140px;padding:12px 7px}.player{min-width:78px;padding:12px 6px 8px}.player .avatar{width:34px;height:34px;margin-top:-24px}.player-name{font-size:13px}.team-label{display:none}.tools{display:grid;grid-template-columns:1fr 1fr}.tool:last-child{grid-column:1/-1}}
    @media(orientation:portrait) and (max-width:700px){body.playing .rotate-hint{display:grid}}
    @media(orientation:landscape) and (max-height:700px){body.playing{overflow:hidden}body.playing .app{width:100%;max-width:none;height:100dvh;padding:3px}body.playing header{display:none}body.playing #matchView{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:3px;height:calc(100dvh - 6px)}body.playing #matchView>.card{position:relative;display:block;padding:4px;height:100%;min-height:0;border-radius:10px}body.playing #matchCourt{height:100%;min-height:0}body.playing #matchCourt .court-wrap,body.playing #matchCourt .court{height:100%;min-height:0}body.playing #matchCourt .court{border-width:3px}body.playing #matchCourt .slot{min-height:0;padding:5px}body.playing #matchCourt .zone{top:3px;font-size:8px}body.playing #matchCourt .player{min-width:62px;padding:7px 4px 4px;border-radius:9px;border-width:1px}body.playing #matchCourt .player .avatar{width:24px;height:24px;margin-top:-16px;border-width:2px;font-size:9px}body.playing #matchCourt .player-name{font-size:11px}body.playing #matchCourt .server-mark{font-size:9px;margin-top:2px;padding-top:2px}body.playing #matchCourt .player.serving-player{box-shadow:0 0 0 3px #ffcf5477,0 4px 10px #001d1766}body.playing .court-score{width:clamp(66px,15vh,96px);height:clamp(66px,15vh,96px);border-width:3px}body.playing .court-score span{top:7px;font-size:9px}body.playing .court-score strong{font-size:clamp(40px,10vh,64px);margin-top:7px}body.playing .notice{position:absolute;left:11px;bottom:29px;z-index:7;margin:0;padding:4px 9px;font-size:9px;border-radius:999px;background:#08231de6}body.playing .history{position:absolute;left:14px;bottom:9px;z-index:7;margin:0;font-size:9px;color:#c3d9d2}body.playing .tools{display:flex;flex-direction:column;gap:3px;margin:0}body.playing .tool{min-height:0;padding:3px 2px;font-size:10px;border-radius:7px}body.playing .tool:last-child{grid-column:auto}}

<body>
<main class="app">
  <header><div class="brand"><div class="logo">🏸</div><div><h1>雙打羽球計分器</h1><div class="sub">排好站位，得分後自動輪轉</div></div></div><div class="pill" id="topStatus">賽前設定</div></header>

  <section id="setupView">
    <div class="card"><div class="step">步驟 1</div><h2>今天誰來打球？</h2><p class="help">輸入姓名加入名單。可加入超過四人，未上場的球員會留在名單中。</p><div class="add"><input id="newPlayer" placeholder="輸入球員姓名" maxlength="12"><button class="small-btn" id="addPlayer">加入</button></div><div class="roster" id="roster"></div></div>
    <div class="card"><div class="step">步驟 2</div><h2>把四位球員排進場地</h2><p class="help">電腦可直接拖曳；手機請先點選名單中的球員，再點場地位置。點場上球員可指定第一位發球者。</p><div id="setupCourt"></div><div class="setup-actions"><button class="secondary" id="clearCourt">清空場地</button><button class="primary" id="startMatch" disabled>開始比賽</button></div><div class="tip" id="setupTip">尚缺 4 位上場球員</div></div>
  </section>

  <section id="matchView" class="hidden">
    <div class="card"><div id="matchCourt"></div><div class="notice" id="notice">直接點選得分方的半場</div><div class="history" id="gameInfo">21 分制 · 單局決勝</div></div>
    <div class="tools"><button class="tool" id="undo" disabled>↶ 復原上一球</button><button class="tool" id="flipScreen">切換橫放方向</button><button class="tool" id="backSetup">調整球員</button><button class="tool danger" id="newMatch">重新比賽</button></div>
  </section>
</main>
<div class="rotate-hint"><div class="rotate-box"><span class="rotate-icon">📱</span><h2>請將手機橫放</h2><p>橫放後即可看到完整球場；若上下方向相反，可進入比賽後按「翻轉方向」。</p><button id="tryLandscape">再次切換橫向</button></div></div>
<div class="dialog-bg" id="dialogBg"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button id="dialogButton">繼續</button></div></div>
<script>
(()=>{
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  const emptySlots=()=>({leftEven:null,leftOdd:null,rightEven:null,rightOdd:null});
  const freshMatch=()=>({score:{left:0,right:0},server:'left',history:[],ended:false});
  let state={phase:'setup',roster:[{id:'p1',name:'郭小龍'},{id:'p2',name:'隊友'},{id:'p3',name:'對手 A'},{id:'p4',name:'對手 B'}],slots:emptySlots(),firstServer:null,selected:null,match:freshMatch()};
  let nextId=5;
  const slotMeta={leftOdd:['A 隊','奇數區'],leftEven:['A 隊','偶數區'],rightEven:['B 隊','偶數區'],rightOdd:['B 隊','奇數區']};
  const person=id=>state.roster.find(p=>p.id===id);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function save(){localStorage.setItem('badmintonDoublesV2',JSON.stringify(state))}
  function courtHTML(mode){
    const slot=(key)=>{const p=person(state.slots[key]),server=mode==='match'&&key===serverSlot();return `<div class="slot ${state.firstServer===key&&mode==='setup'?'selected-slot':''}" data-slot="${key}"><span class="zone">${slotMeta[key][1]}</span>${p?`<div class="player ${server?'serving-player':''}" draggable="${mode==='setup'}" data-player="${p.id}"><span class="avatar">${esc(p.name.slice(0,1))}</span><div class="player-name">${esc(p.name)}</div>${server?'<div class="server-mark">目前發球</div>':''}</div>`:'<div class="empty">放置球員</div>'}</div>`};
    const scores=mode==='match'?`<div class="court-score left"><span>A 隊</span><strong id="leftScore">${state.match.score.left}</strong></div><div class="court-score right"><span>B 隊</span><strong id="rightScore">${state.match.score.right}</strong></div>`:'';
    const half=(side,team,inside)=>`<div class="half ${side}-half${mode==='match'?' score-side':''}"${mode==='match'?` role="button" tabindex="0" data-team="${team}" aria-label="${team==='left'?'A':'B'}隊得分"`:''}>${inside}</div>`;
    return `<div class="court-wrap"><div class="court">${half('left','left',slot('leftOdd')+slot('leftEven'))}${half('right','right',slot('rightEven')+slot('rightOdd'))}<div class="net"></div><div class="team-label left">A 隊</div><div class="team-label right">B 隊</div>${scores}</div></div>`;
  }
  function serverSlot(){const m=state.match,parity=m.score[m.server]%2===0?'Even':'Odd';return m.server+parity}
  function serverPerson(){return person(state.slots[serverSlot()])}
  function occupied(){return Object.values(state.slots).filter(Boolean)}
  function bindCourt(root,setup){
    root.querySelectorAll('[draggable="true"]').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.player)));
    if(!setup){root.querySelectorAll('.score-side').forEach(el=>{const score=()=>{el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),140);point(el.dataset.team)};el.addEventListener('click',score);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();score()}})});return}
    root.querySelectorAll('.slot').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover')});el.addEventListener('dragleave',()=>el.classList.remove('dragover'));el.addEventListener('drop',e=>{e.preventDefault();assign(e.dataTransfer.getData('text/plain'),el.dataset.slot)});el.addEventListener('click',()=>{const key=el.dataset.slot;if(state.selected)assign(state.selected,key);else if(state.slots[key])chooseServer(key)})});
  }
  function renderSetup(){
    $('#roster').innerHTML=state.roster.map(p=>`<button class="person-chip ${state.selected===p.id?'selected':''} ${occupied().includes(p.id)?'oncourt':''}" draggable="true" data-id="${p.id}"><span class="avatar">${esc(p.name.slice(0,1))}</span>${esc(p.name)}<span class="remove" data-remove="${p.id}">×</span></button>`).join('');
    $$('#roster .person-chip').forEach(el=>{el.onclick=e=>{if(e.target.dataset.remove){removePlayer(e.target.dataset.remove);return}state.selected=state.selected===el.dataset.id?null:el.dataset.id;renderSetup()};el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.id))});
    $('#setupCourt').innerHTML=courtHTML('setup');bindCourt($('#setupCourt'),true);const count=occupied().length,ready=count===4&&state.firstServer;
    $('#startMatch').disabled=!ready;$('#setupTip').textContent=count<4?`尚缺 ${4-count} 位上場球員`:state.firstServer?`第一位發球：${person(state.slots[state.firstServer]).name}`:'請點選一位場上球員作為第一位發球者';save();
  }
  function assign(id,target){if(!person(id))return;const source=Object.keys(state.slots).find(k=>state.slots[k]===id),replaced=state.slots[target];if(source)state.slots[source]=replaced;state.slots[target]=id;if(state.firstServer===source)state.firstServer=target;else if(state.firstServer===target)state.firstServer=null;state.selected=null;renderSetup()}
  function chooseServer(key){
    const team=key.startsWith('left')?'left':'right';if(key.endsWith('Odd')){const even=team+'Even';[state.slots[key],state.slots[even]]=[state.slots[even],state.slots[key]];key=even}
    state.firstServer=key;renderSetup();
  }
  function removePlayer(id){Object.keys(state.slots).forEach(k=>{if(state.slots[k]===id){state.slots[k]=null;if(state.firstServer===k)state.firstServer=null}});state.roster=state.roster.filter(p=>p.id!==id);if(state.selected===id)state.selected=null;renderSetup()}
  function addPlayer(){const input=$('#newPlayer'),name=input.value.trim();if(!name)return;if(state.roster.some(p=>p.name===name)){alert('名單中已有相同姓名');return}state.roster.push({id:'p'+nextId++,name});input.value='';renderSetup()}
  function renderMatch(){
    const m=state.match;$('#matchCourt').innerHTML=courtHTML('match');bindCourt($('#matchCourt'),false);$('#undo').disabled=!m.history.length;$('#topStatus').textContent=m.ended?'本場結束':'單局比賽';$('#gameInfo').textContent='21 分制 · 單局決勝';
    if(!m.ended){const deuce=m.score.left>=20&&m.score.right>=20;$('#notice').textContent=deuce?'延長賽：領先 2 分獲勝，最高 30 分':`${serverPerson()?.name||'—'}從${m.score[m.server]%2===0?'右側':'左側'}發球`}
    save();
  }
  function snapshot(){const m=state.match;m.history.push(JSON.stringify({match:{...m,history:[]},slots:{...state.slots}}));if(m.history.length>80)m.history.shift()}
  function swapTeam(team){const a=team+'Even',b=team+'Odd';[state.slots[a],state.slots[b]]=[state.slots[b],state.slots[a]]}
  function gameOver(a,b){return ((a>=21||b>=21)&&Math.abs(a-b)>=2)||a===30||b===30}
  function point(team){const m=state.match;if(m.ended)return;snapshot();const kept=m.server===team;m.score[team]++;if(kept)swapTeam(team);m.server=team;
    if(gameOver(m.score.left,m.score.right)){const win=m.score.left>m.score.right?'left':'right',label=win==='left'?'A 隊':'B 隊',keys=win==='left'?['leftEven','leftOdd']:['rightEven','rightOdd'],names=keys.map(k=>person(state.slots[k])?.name).filter(Boolean).join('、');m.ended=true;renderMatch();$('#notice').textContent=`${label}獲勝`;show(`${label}獲勝`,`${names?names+'｜':''}本場比分 ${m.score.left}：${m.score.right}`,()=>{state.slots=emptySlots();state.firstServer=null;state.match=freshMatch();showSetup()});return}
    renderMatch();
  }
  function show(title,text,cb){$('#dialogTitle').textContent=title;$('#dialogText').textContent=text;$('#dialogBg').classList.add('show');$('#dialogButton').onclick=()=>{$('#dialogBg').classList.remove('show');cb&&cb()}}
  function preferredOrientation(){return localStorage.getItem('badmintonLandscapeSide')==='secondary'?'landscape-secondary':'landscape-primary'}
  async function lockLandscape(direction){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock(direction);return true}}catch(e){}return false}
  async function enterLandscape(){const ok=await lockLandscape(preferredOrientation());if(!ok&&state.phase==='match')$('#notice').textContent='請開啟手機自動旋轉，並將手機橫放'}
  async function flipScreen(){const oldSide=localStorage.getItem('badmintonLandscapeSide')==='secondary'?'secondary':'primary',nextSide=oldSide==='primary'?'secondary':'primary';localStorage.setItem('badmintonLandscapeSide',nextSide);const ok=await lockLandscape(`landscape-${nextSide}`);if(!ok){localStorage.setItem('badmintonLandscapeSide',oldSide);alert('此瀏覽器不支援指定橫放方向，請開啟手機自動旋轉後，將手機轉到另一側。');return}$('#notice').textContent='橫放方向已切換'}
  function leaveLandscape(){try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}}
  function start(){state.match=freshMatch();state.match.server=state.firstServer.startsWith('left')?'left':'right';state.phase='match';document.body.classList.add('playing');$('#setupView').classList.add('hidden');$('#matchView').classList.remove('hidden');renderMatch();enterLandscape()}
  function showSetup(){state.phase='setup';document.body.classList.remove('playing');leaveLandscape();$('#matchView').classList.add('hidden');$('#setupView').classList.remove('hidden');$('#topStatus').textContent='賽前設定';renderSetup()}
  $('#addPlayer').onclick=addPlayer;$('#newPlayer').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()});$('#clearCourt').onclick=()=>{state.slots=emptySlots();state.firstServer=null;renderSetup()};$('#startMatch').onclick=start;$('#tryLandscape').onclick=enterLandscape;$('#flipScreen').onclick=flipScreen;
  $('#undo').onclick=()=>{const h=state.match.history;if(!h.length)return;const prev=JSON.parse(h.pop());prev.match.history=h;state.match=prev.match;state.slots=prev.slots;$('#dialogBg').classList.remove('show');renderMatch()};$('#backSetup').onclick=()=>{if(confirm('回到設定會清除目前比分，確定嗎？'))showSetup()};$('#newMatch').onclick=()=>{if(confirm('保留今天的名單並重新排場，確定嗎？')){state.slots=emptySlots();state.firstServer=null;state.match=freshMatch();showSetup()}};
  try{const saved=JSON.parse(localStorage.getItem('badmintonDoublesV2'));if(saved?.roster){state=saved;nextId=Math.max(5,...state.roster.map(p=>Number(p.id.replace(/\D/g,''))||0))+1}}catch(e){}
  if(state.phase==='match'&&occupied().length===4){document.body.classList.add('playing');$('#setupView').classList.add('hidden');$('#matchView').classList.remove('hidden');renderMatch()}else showSetup();
})();
</script>
